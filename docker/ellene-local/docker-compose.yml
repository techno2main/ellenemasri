services:
  ellene-local-db:
    image: mariadb:11.4
    container_name: ellene-local-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wp_ellene_local
      MARIADB_USER: ellene
      MARIADB_PASSWORD: ellene
      MARIADB_ROOT_PASSWORD: root
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - ellene_local_db_data:/var/lib/mysql
      - ../../documentation/migration-ovh/ubocrhyem26db.sql.gz:/docker-entrypoint-initdb.d/01-prod.sql.gz:ro
    ports:
      - "3308:3306"
    networks:
      - ellene-local-net

  ellene-local-wp:
    image: wordpress:6.5.5-php8.2-apache
    container_name: ellene-local-wp
    restart: unless-stopped
    depends_on:
      - ellene-local-db
    environment:
      WORDPRESS_DB_HOST: ellene-local-db:3306
      WORDPRESS_DB_NAME: wp_ellene_local
      WORDPRESS_DB_USER: ellene
      WORDPRESS_DB_PASSWORD: ellene
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - ../../wp:/var/www/html
      - ./wp-config.docker.php:/var/www/html/wp-config.php:ro
    ports:
      - "8090:80"
    networks:
      - ellene-local-net

  ellene-local-pma:
    image: phpmyadmin:5.2.1-apache
    container_name: ellene-local-pma
    restart: unless-stopped
    depends_on:
      - ellene-local-db
    environment:
      PMA_HOST: ellene-local-db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: http://localhost:8091/
    ports:
      - "8091:80"
    networks:
      - ellene-local-net

volumes:
  ellene_local_db_data:

networks:
  ellene-local-net:
    name: ellene-local-net
